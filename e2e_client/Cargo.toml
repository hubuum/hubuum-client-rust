[package]
name = "e2e_client"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
integration-tests = []
session-tests = ["integration-tests"]
restore-tests = ["integration-tests"]
query-usage-native-tests = ["integration-tests"]

[[test]]
name = "sessions"
required-features = ["session-tests"]

[[test]]
name = "query_usage_native"
required-features = ["query-usage-native-tests"]

[[test]]
name = "restore"
required-features = ["restore-tests"]

[dependencies]
getrandom = "0.4"
hubuum_client = { path = "..", features = ["async", "blocking"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
yare = "3"
