[package]
name = "e2e_client"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
integration-tests = []
session-tests = ["integration-tests"]
restore-tests = ["integration-tests"]
query-usage-native-tests = ["integration-tests"]
project-authentication-tests = ["integration-tests"]

[[bin]]
name = "authentication-project"
required-features = ["project-authentication-tests"]

[[test]]
name = "sessions"
required-features = ["session-tests"]

[[test]]
name = "query_usage_native"
required-features = ["query-usage-native-tests"]

[[test]]
name = "restore"
required-features = ["restore-tests"]

[dependencies]
integration_support = { path = "../integration_support" }
hubuum_client = { path = "..", features = ["async", "blocking"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
getrandom = "0.4"
yare = "3"
