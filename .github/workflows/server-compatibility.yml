name: Server Compatibility

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  latest-server:
    name: Latest Server Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-22

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Against Latest Server
        run: ./scripts/run-integration-tests.sh --with-e2e-client -- --test-threads=1
        env:
          HUBUUM_INTEGRATION_SERVER_IMAGE: ghcr.io/hubuum/hubuum-server:main
          HUBUUM_INTEGRATION_EXPECT_CREDENTIAL_APPROVALS: "1"
