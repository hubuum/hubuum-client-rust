name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      run_semver:
        description: Run the public API compatibility check for this invocation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  HUBUUM_TARGET_SERVER_VERSION: "0.0.16"
  HUBUUM_TARGET_SERVER_IMAGE: ghcr.io/hubuum/hubuum-server@sha256:37b3299edd845a0c2aa7772d7d68565233ac8c1802bc44be3fb4bbc6dfa8778e

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.policy.outputs.code }}
      markdown: ${{ steps.policy.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test CI selection and gate
        run: python3 scripts/test-ci-policy.py
      - name: Classify changes
        id: policy
        run: python3 scripts/ci-policy.py

  markdown:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  quality:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Application quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test Release Provenance Guard
        run: ./scripts/test-release-provenance.sh

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Generated Resource Code
        run: cargo run -p hubuum_reconcile --locked -- check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Validate Pinned OpenAPI Contract
        run: python3 scripts/openapi-contract.py validate

      - name: Test GitHub Release Helpers
        run: ./scripts/test-github-release.sh

  test:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Unit, Behavior, and Compile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Full Test Suite
        run: cargo test --workspace --all-features --locked

  features:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Feature Set (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-client
            flags: --no-default-features
          - name: async
            flags: --no-default-features --features async
          - name: blocking
            flags: --no-default-features --features blocking
          - name: async-typed
            flags: --no-default-features --features async,typed-schemas
          - name: blocking-typed
            flags: --no-default-features --features blocking,typed-schemas
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Feature Set
        run: cargo check -p hubuum_client --locked ${{ matrix.flags }}

  msrv:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    # Keep this check name stable because the main-branch ruleset requires it.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - name: Check Workspace at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  server-contract:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    # Keep this check name stable because the main-branch ruleset requires it.
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with Target Server OpenAPI
        run: python3 scripts/openapi-contract.py check

  supply-chain:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Published Advisories
        # Node 24 support is on RustSec's default branch but not yet tagged.
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Licenses, Bans, and Sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          rust-version: 1.88

  semver:
    needs: changes
    name: Public API Compatibility
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run_semver)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check SemVer
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features

  integration:
    if: needs.changes.outputs.code == 'true'
    name: Integration Tests (Pinned Server)
    runs-on: ubuntu-latest
    needs: [changes, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Integration Test Suite
        run: ./scripts/run-integration-tests.sh --with-e2e-client -- --test-threads=1
        env:
          HUBUUM_INTEGRATION_SERVER_IMAGE: ${{ env.HUBUUM_TARGET_SERVER_IMAGE }}
          HUBUUM_INTEGRATION_EXPECT_CREDENTIAL_APPROVALS: "1"

  ci-gate:
    # Preserve the existing required check name while aggregating every CI job.
    name: Formatting, Lints, and Docs
    if: always()
    needs: [changes, markdown, quality, test, features, msrv, server-contract, supply-chain, integration, semver]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Require every selected check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CODE_JOBS: >-
            quality test features msrv server-contract supply-chain integration
            ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run_semver) && 'semver' || '' }}
        run: python3 scripts/ci-policy.py --gate
