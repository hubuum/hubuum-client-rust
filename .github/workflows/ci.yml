name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - project/auth-support
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      run_semver:
        description: Run the public API compatibility check for this invocation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  HUBUUM_TARGET_SERVER_VERSION: "0.0.22"
  HUBUUM_TARGET_SERVER_IMAGE: ghcr.io/hubuum/hubuum-server@sha256:71ff4090eac071f23ae59f7265dc07165939d42771a73d1d291defa023b4964b

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.policy.outputs.code }}
      markdown: ${{ steps.policy.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test CI selection and gate
        run: python3 scripts/test-ci-policy.py
      - name: Classify changes
        id: policy
        run: python3 scripts/ci-policy.py

  markdown:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: '.markdownlint.json'
          globs: '**/*.md'

  quality:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Application quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-22
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test Release Provenance Guard
        run: ./scripts/test-release-provenance.sh

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Generated Resource Code
        run: cargo run -p hubuum_reconcile --locked -- check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Validate Pinned OpenAPI Contract
        run: python3 scripts/openapi-contract.py validate

      - name: Test GitHub Release Helpers
        run: ./scripts/test-github-release.sh


      - name: Prepare authentication candidate
        if: github.ref == 'refs/heads/project/auth-support' || github.base_ref == 'project/auth-support'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          cargo package -p hubuum_client --locked --no-verify
          mkdir -p "$RUNNER_TEMP/auth-candidate"
          cp target/package/*.crate "$RUNNER_TEMP/auth-candidate/"
          git archive --format=tar.gz --output="$RUNNER_TEMP/auth-candidate/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/auth-candidate/TESTED_COMMIT"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/auth-candidate/SOURCE_COMMIT"
          printf '%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/auth-candidate/WORKFLOW_RUN"
          (cd "$RUNNER_TEMP/auth-candidate" && sha256sum ./* > SHA256SUMS)
      - name: Retain authentication candidate
        if: github.ref == 'refs/heads/project/auth-support' || github.base_ref == 'project/auth-support'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth-candidate/
          if-no-files-found: error
          retention-days: 30

  test:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Unit, Behavior, and Compile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-22

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run Full Test Suite
        run: cargo test --workspace --all-features --locked

  features:
    # Expand every required feature check even for documentation-only changes.
    needs: changes
    name: Feature Set (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-client
            flags: --no-default-features
          - name: async
            flags: --no-default-features --features async
          - name: blocking
            flags: --no-default-features --features blocking
          - name: async-typed
            flags: --no-default-features --features async,typed-schemas
          - name: blocking-typed
            flags: --no-default-features --features blocking,typed-schemas
    steps:
      - name: Documentation-only status
        if: needs.changes.outputs.code == 'false'
        run: echo 'Documentation-only change; feature compilation is not required.'

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-22

      - name: Cache Cargo Artifacts
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Feature Set
        if: needs.changes.outputs.code == 'true'
        run: cargo check -p hubuum_client --locked ${{ matrix.flags }}

      - name: Check Examples
        if: needs.changes.outputs.code == 'true'
        run: cargo check -p hubuum_client --locked --examples ${{ matrix.flags }}

  msrv:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    # Keep this check name stable because the main-branch ruleset requires it.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-22
        with:
          toolchain: '1.88'

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check Workspace at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  server-contract:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    # Keep this check name stable because the main-branch ruleset requires it.
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with Target Server OpenAPI
        run: python3 scripts/openapi-contract.py check

  supply-chain:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Published Advisories
        # Node 24 support is on RustSec's default branch but not yet tagged.
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main 2026-03-20 (Node 24)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Licenses, Bans, and Sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          rust-version: 1.88

  semver:
    needs: changes
    name: Public API Compatibility
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run_semver)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check SemVer
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features

  integration:
    if: needs.changes.outputs.code == 'true'
    name: Integration Tests (Pinned Server)
    runs-on: ubuntu-latest
    needs: [changes, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-22

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Integration Test Suite
        run: ./scripts/run-integration-tests.sh --with-e2e-client -- --test-threads=1
        env:
          HUBUUM_INTEGRATION_SERVER_IMAGE: ${{ env.HUBUUM_TARGET_SERVER_IMAGE }}
          HUBUUM_INTEGRATION_EXPECT_CREDENTIAL_APPROVALS: "1"

  ci-gate:
    # Preserve the existing required check name while aggregating every CI job.
    name: Formatting, Lints, and Docs
    if: always()
    needs: [changes, markdown, quality, test, features, msrv, server-contract, supply-chain, integration, semver]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Require every selected check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CODE_JOBS: >-
            quality test features msrv server-contract supply-chain integration
            ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run_semver) && 'semver' || '' }}
        run: python3 scripts/ci-policy.py --gate
