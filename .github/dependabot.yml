version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # dtolnay/rust-toolchain refs select Rust toolchains (for example 1.88),
    # not action releases. Keep those selectors intentional.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /tests/container_integration/fixtures/postgres
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
