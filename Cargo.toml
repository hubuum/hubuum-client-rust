[workspace]
members = ["hubuum_reconcile", "e2e_client", "integration_support"]
resolver = "3"

[package]
name = "hubuum_client"
version = "0.20.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust client library targeting Hubuum server v0.0.21 with synchronous and asynchronous interfaces."
repository = "https://github.com/hubuum/hubuum-client-rust"
documentation = "https://docs.rs/hubuum_client"
readme = "README.md"
keywords = ["hubuum", "api", "client", "async"]
categories = ["api-bindings"]
exclude = [
    ".github/",
    "hubuum_reconcile/",
    "integration_support/",
    "openapi/",
    "scripts/",
    "tests/",
]

[package.metadata.hubuum]
server-version = "0.0.21"
server-image = "ghcr.io/hubuum/hubuum-server@sha256:a5e1ad7a17281eefb4c1ed4da172a80bf815840f78bde6390d1e42bb2d51e0b6"

[[example]]
name = "discover_fields"
required-features = ["async"]

[[example]]
name = "discover_fields_blocking"
required-features = ["blocking"]

[[example]]
name = "activate_schema"
required-features = ["async"]

[[example]]
name = "activate_schema_blocking"
required-features = ["blocking"]

[features]
default = ["async"]
async = [
    "tokio",
    "reqwest/json",
    "reqwest/rustls",
    "reqwest/stream",
    "dep:async-stream",
    "dep:bytes",
    "dep:futures-core",
    "dep:futures-util",
]
blocking = ["reqwest/blocking", "reqwest/json", "reqwest/rustls"]
integration-tests = []
typed-schemas = ["dep:schemars"]

[dependencies]
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
serde_urlencoded = "0.7"
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
percent-encoding = "2"
secrecy = { version = "0.10", features = ["serde"] }
serde_path_to_error = "0.1"
strum = { version = "0.28", features = ["derive", "strum_macros"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "time", "sync"], optional = true }
async-stream = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
fastrand = "2"
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
httpdate = "1"
schemars = { version = "1", features = ["chrono04"], optional = true }
tempfile = "3"

[dev-dependencies]
integration_support = { path = "integration_support" }
tokio = { version = "1", features = ["full"] }
yare = "3"
httpmock = "0.9"
rstest = "0.28"
trybuild = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
